name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: America/Bogota
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          config_display: large
          extras_css: |
            svg, #metrics, #metrics-end { background: #0a0a0a; }
            #metrics { color: #f5f5f5; font-family: "Space Mono", ui-monospace, monospace; }
            .field { color: #d4d4d4; }
            .field svg { fill: #6b6b6b; }
            h2.field { color: #e11d2e; letter-spacing: 3px; text-transform: uppercase; }
            h2.field svg { fill: #e11d2e; }
            h3.field { color: #a3a3a3; letter-spacing: 2px; text-transform: uppercase; }
            .avatar { filter: grayscale(1) contrast(1.15); border: 2px solid #e11d2e; }
            .language.details small { color: #a3a3a3; }
            [fill="#3178c6" i] { fill: #e11d2e; }
            [fill="#f1e05a" i] { fill: #f5f5f5; }
            [fill="#b07219" i] { fill: #b91c2b; }
            [fill="#663399" i] { fill: #a3a3a3; }
            [fill="#3572a5" i] { fill: #7f1520; }
            [fill="#e34c26" i] { fill: #d4d4d4; }
            [fill="#89e051" i] { fill: #6b6b6b; }
            [fill="#384d54" i] { fill: #4a0d12; }
            [fill="#a97bff" i] { fill: #ff5a67; }
            [fill="#dea584" i] { fill: #8a8a8a; }
            [fill="#178600" i] { fill: #5c0a12; }
            [fill="#4f5d95" i] { fill: #c4c4c4; }
            [fill="#ebedf0" i] { fill: #1a1a1a; }
            [fill="#9be9a8" i] { fill: #4a0d12; }
            [fill="#40c463" i] { fill: #7f1520; }
            [fill="#30a14e" i] { fill: #b91c2b; }
            [fill="#216e39" i] { fill: #e11d2e; }
