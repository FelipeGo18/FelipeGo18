name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: America/Bogota
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
          plugin_habits_from: 200
          extras_css: |
            svg, #metrics, #metrics-end { background: #0a0a0a; }
            * { color: #f5f5f5; fill: #f5f5f5; font-family: "Space Mono", ui-monospace, monospace; }
            h2, h2 * { color: #e11d2e; fill: #e11d2e; text-transform: uppercase; letter-spacing: 2px; }
            .field, .field * { color: #a3a3a3; fill: #a3a3a3; }
            .bar, .commits.bar, .habits .bar { background: #e11d2e !important; }
